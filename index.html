<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PAIMANA | Project Assessment, Infrastructure Monitoring & Analytics for Nation-building</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <style>
    :root {
      --navy-950: #0A1526;
      --navy-900: #0E1F38;
      --navy-800: #14294A;
      --navy-700: #1C3559;
      --graphite: #263447;
      --paper: #F6F7F9;
      --paper-2: #EEF1F5;
      --card: #FFFFFF;
      --ink: #131B29;
      --ink-soft: #4B5768;
      --line: #E2E6EC;
      --amber: #E2A33B;
      --amber-deep: #C6811F;
      --green: #2E9E63;
      --green-bg: #E6F5EC;
      --red: #D24B4B;
      --red-bg: #FBEAEA;
      --blue-chip: #3168C7;
      --blue-chip-bg: #E8F0FC;
      --radius-card: 14px;
      --shadow-card: 0 1px 2px rgba(10, 21, 38, 0.06), 0 8px 24px -12px rgba(10, 21, 38, 0.18);
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
    }

    :root[data-theme="dark"] {
      --navy-950: #0A1526;
      --navy-900: #14294A;
      --paper: #0B1420;
      --paper-2: #0F1B2B;
      --card: #101E30;
      --ink: #EAF0F8;
      --ink-soft: #94A3B8;
      --line: #1E2E44;
      color-scheme: dark;
    }

    :root[data-theme="dark"] .mospi-logo {
      filter: brightness(0) invert(1);
    }

    /* Dark-mode text-legibility overrides: these classes are applied ONLY to
   navy-900/navy-950 usages that are TEXT color on theme-aware backgrounds.
   Do not apply to any navy-900/navy-950 BACKGROUND usage. */
    :root[data-theme="dark"] .navy950-text {
      color: var(--ink) !important;
    }

    :root[data-theme="dark"] .navy900-text {
      color: var(--ink) !important;
    }

    html {
      scroll-padding-top: 140px;
      scroll-behavior: smooth;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4,
    .font-display {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }

    .font-mono-data {
      font-family: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background: var(--amber);
      color: var(--navy-950);
    }

    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .snap-x-cards {
      scroll-snap-type: x proximity;
    }

    .snap-card {
      scroll-snap-align: start;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal {
      animation: fadeSlideUp .6s cubic-bezier(.16, .84, .44, 1) both;
    }

    @keyframes dashDraw {
      from {
        stroke-dashoffset: var(--dash-len);
      }

      to {
        stroke-dashoffset: var(--dash-final);
      }
    }

    @keyframes growUp {
      from {
        transform: scaleY(0);
      }

      to {
        transform: scaleY(1);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -300px 0;
      }

      100% {
        background-position: 300px 0;
      }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--paper-2) 0%, var(--line) 50%, var(--paper-2) 100%);
      background-size: 300px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 8px;
    }

    @keyframes floatSlow {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes particleDrift {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-40px, -60px);
      }
    }

    .focus-ring:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
      border-radius: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .card-surface {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
    }

    .hover-lift {
      transition: transform .25s cubic-bezier(.16, .84, .44, 1), box-shadow .25s;
    }

    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 8px rgba(10, 21, 38, 0.08), 0 20px 32px -14px rgba(10, 21, 38, 0.28);
    }
  </style>
</head>

    function uniqueByProjectUid(projects) {
      const seen = new Set();
      return projects.filter(p => {

        return true;

    function filterProjects({ sector, ministry, state, costBand, month } = {}) {
      // No month selected = current portfolio: latest available record per project.
      // A month selected = that month's monitoring snapshot.
      let source = month ? ALL_PROJECTS.filter(p => p.reportMonth === month) : CURRENT_PROJECTS;
      source = uniqueByProjectUid(source);

      return source.filter((p) => {
        if (sector && sector !== "All" && p.sector !== sector) return false;
        if (ministry && ministry !== "All" && p.ministry !== ministry) return false;
        if (state && state !== "All" && p.state !== state) return false;
        if (costBand === "> 500" && !(p.originalCost > 500)) return false;
        if (costBand === "<= 500" && !(p.originalCost <= 500)) return false;
        return true;
      });
    }

    function summarize(projects) {
      const count = projects.length;
      const original = projects.reduce((s, p) => s + (p.originalCost || 0), 0);
      const revised = projects.reduce((s, p) => s + (p.revisedCost || 0), 0);
      const expenditure = projects.reduce((s, p) => s + (p.expenditure || 0), 0);
      const completedThisMonth = projects.filter((p) => p.status === "Completed" || p.physicalProgress >= 97).length;
      return { count, original, revised, expenditure, completedThisMonth, newlyAdded: 0 };
    }

    function sectorDistribution(projects) {
      const map = {};

      projects.forEach((p) => {
        if (!p.sector) return;

        if (!map[p.sector]) {
          map[p.sector] = {
            sector: p.sector,
            count: 0,
            cost: 0
          };
        }

        map[p.sector].count += 1;
        map[p.sector].cost += Number(p.revisedCost) || 0;
      });

      return Object.values(map).sort((a, b) => b.count - a.count);
    }

    function stateDistribution(projects) {
      const map = {};

      projects.forEach((p) => {
        if (!p.state) return;

        if (!map[p.state]) {
          map[p.state] = {
            state: p.state,
            count: 0
          };
        }

        map[p.state].count += 1;
      });

      return Object.values(map).sort((a, b) => b.count - a.count);

    function timeMetricBuckets(projects) {
      const delaySlippage = [
        { label: "Ahead / < 0 mo", min: -Infinity, max: 0, delay: 0, slippage: 0 },
        { label: "0–6 mo", min: 0, max: 6, delay: 0, slippage: 0 },
        { label: "6–12 mo", min: 6, max: 12, delay: 0, slippage: 0 },
        { label: "12–24 mo", min: 12, max: 24, delay: 0, slippage: 0 },
        { label: "24–48 mo", min: 24, max: 48, delay: 0, slippage: 0 },
        { label: "≥ 48 mo", min: 48, max: Infinity, delay: 0, slippage: 0 },
      ];
      const costOverrun = [
        { label: "< 0%", min: -Infinity, max: 0, count: 0 },
        { label: "0–10%", min: 0, max: 10, count: 0 },
        { label: "10–25%", min: 10, max: 25, count: 0 },
        { label: "25–50%", min: 25, max: 50, count: 0 },
        { label: "≥ 50%", min: 50, max: Infinity, count: 0 },
      ];

      projects.forEach((p) => {
        const delay = Number(p.delayMonths);
        const slippage = Number(p.currentSlippageMonths);
        const overrun = Number(p.costOverrunPct);

        if (Number.isFinite(delay)) {
          const b = delaySlippage.find((b) => delay >= b.min && delay < b.max);
          if (b) b.delay += 1;
        }
        if (Number.isFinite(slippage)) {
          const b = delaySlippage.find((b) => slippage >= b.min && slippage < b.max);
          if (b) b.slippage += 1;
        }
        if (Number.isFinite(overrun)) {
          const b = costOverrun.find((b) => overrun >= b.min && overrun < b.max);
          if (b) b.count += 1;
        }
      });

      return { delaySlippage, costOverrun };
    }

    function progressBuckets(projects) {
      const buckets = [
        { label: "< 20%", min: 0, max: 20, count: 0 },
        { label: "20–40%", min: 20, max: 40, count: 0 },
        { label: "40–60%", min: 40, max: 60, count: 0 },
        { label: "60–80%", min: 60, max: 80, count: 0 },
        { label: "≥ 80%", min: 80, max: 101, count: 0 },
      ];
      projects.forEach((p) => {
        const progress = Number(p.physicalProgress);
        const b = buckets.find((b) => progress >= b.min && progress < b.max);

      });

    const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

    function useOnScreen(options) {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        if (!ref.current) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
        }, options || { threshold: 0.25 });
        obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);
      return [ref, visible];
    }

    function useCountUp(target, { duration = 1200, decimals = 0, start = true } = {}) {
      const [value, setValue] = useState(0);
      const raf = useRef(null);
      useEffect(() => {
        if (!start) return;
        const t0 = performance.now();
        const from = 0;
        function tick(now) {
          const p = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          setValue(from + (target - from) * eased);
          if (p < 1) raf.current = requestAnimationFrame(tick);
        }
        raf.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf.current);
      }, [target, start, duration]);
      return decimals > 0 ? value.toFixed(decimals) : Math.round(value);
    }

    function AnimatedDonut({ data, valueKey, labelKey, size = 210, thickness = 26, centerLabel, formatValue }) {
      const [ref, visible] = useOnScreen({ threshold: 0.2 });
      const total = data.reduce((s, d) => s + d[valueKey], 0) || 1;
      const r = (size - thickness) / 2;
      const cx = size / 2, cy = size / 2;
      const circumference = 2 * Math.PI * r;
      let cumulative = 0;
      return (
        <div className="flex flex-col items-center">

              {data.map((d, i) => {
                const frac = d[valueKey] / total;
                const len = frac * circumference;
                const offset = cumulative;
                cumulative += len;
                return (
                  <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={PALETTE[i % PALETTE.length]}
                    strokeWidth={thickness} strokeDasharray={`${circumference}`}
                    strokeDashoffset={visible ? circumference - len : circumference}
                    style={{
                      transform: `rotate(${(offset / circumference) * 360}deg)`,
                      transformOrigin: `${cx}px ${cy}px`,
                      transition: `stroke-dashoffset 1.1s cubic-bezier(.16,.84,.44,1) ${i * 90}ms`,
                    }} strokeLinecap="butt" />
                );
              })}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-[11px] uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{centerLabel}</span>
              <span className="font-display text-xl font-semibold font-mono-data">{formatValue ? formatValue(total) : fmtIndianNumber(total)}</span>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-x-4 gap-y-2 mt-5 w-full">
            {data.map((d, i) => (
              <div key={i} className="flex items-center gap-2 text-[12.5px]">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: PALETTE[i % PALETTE.length] }} />
                <span className="truncate" style={{ color: "var(--ink-soft)" }} title={d[labelKey]}>{d[labelKey]}</span>
                <span className="ml-auto font-mono-data font-medium">{Math.round((d[valueKey] / total) * 100)}%</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AnimatedGroupedBars({ data, labelKey, valueKeys, labels, height = 200, colors = ["var(--navy-700)", "var(--amber)"] }) {
      const [ref, visible] = useOnScreen({ threshold: 0.25 });
      const max = Math.max(...data.flatMap((d) => valueKeys.map((key) => Number(d[key]) || 0)), 1);
      return (
        <div ref={ref} className="flex items-end gap-2" style={{ height }}>

            <div key={i} className="flex-1 flex flex-col items-center justify-end h-full min-w-0">

                  return (
                    <div key={key} className="flex-1 flex flex-col items-center justify-end h-full max-w-8">
                      <span className="text-[9px] font-mono-data font-semibold mb-1" style={{ color: "var(--ink)" }}>{fmtIndianNumber(value)}</span>

    function AnimatedBars({ data, labelKey, valueKey, height = 200, color = "var(--navy-700)" }) {

    function normalizeRisk(value) {
      if (value === null || value === undefined || value === "") return null;

      const n = Number(value);
      if (!Number.isFinite(n)) return null;

      // Dataset may contain either:
      // 0.215  -> 21.5%
      // 21.5   -> 21.5%
      // 2150   -> 21.5%
      if (n > 100) return Math.min(1, Math.max(0, n / 10000));
      if (n > 1) return Math.min(1, Math.max(0, n / 100));
      return Math.min(1, Math.max(0, n));
    }

    const getRiskColor = (combinedRisk, band) => {
      if (band === "High" || combinedRisk >= 0.7) return { text: "var(--red)", bg: "var(--red-bg)", bar: "var(--red)" };
      if (band === "Medium" || combinedRisk >= 0.4) return { text: "var(--amber-deep)", bg: "rgba(226,163,59,0.14)", bar: "var(--amber)" };
      return { text: "var(--green)", bg: "var(--green-bg)", bar: "var(--green)" };
    };

    const getStatusStyle = (status) => {
      const s = String(status || "").toLowerCase();
      if (s.includes("complete")) {
        return { color: "var(--green)", bg: "var(--green-bg)", border: "rgba(46,158,99,0.3)" };
      }
      if (s.includes("progress") || s.includes("ongoing") || s.includes("track") || s.includes("implement")) {
        return { color: "var(--blue-chip)", bg: "var(--blue-chip-bg)", border: "rgba(49,104,199,0.25)" };
      }
      if (s.includes("delay")) {
        return { color: "var(--red)", bg: "var(--red-bg)", border: "rgba(210,75,75,0.25)" };
      }
      return { color: "var(--ink-soft)", bg: "var(--paper-2)", border: "var(--line)" };
    };

    const hasScore = (v) => v !== null && v !== undefined && Number.isFinite(Number(v));

    const getRiskDrivers = (p) => {
      const cost = [];
      const time = [];
      const redStyle = { color: "var(--red)", bg: "var(--red-bg)", border: "rgba(210,75,75,0.3)" };
      const neutralStyle = { color: "var(--ink)", bg: "var(--paper-2)", border: "var(--line)" };

      const pushDriver = (targetArr, labelPrefix, icon, name, impact) => {
        if (name === undefined || name === null || impact === undefined || impact === null || !Number.isFinite(Number(impact))) return;
        const style = Number(impact) > 0 ? redStyle : neutralStyle;
        targetArr.push({
          label: `${labelPrefix}: ${name} (${Number(impact).toFixed(2)})`,
          icon,
          ...style,
        });
      };

      pushDriver(cost, "Cost Driver 1", "trendUp", p.cost_driver_1_name, p.cost_driver_1_impact);
      pushDriver(cost, "Cost Driver 2", "trendUp", p.cost_driver_2_name, p.cost_driver_2_impact);
      pushDriver(time, "Time Driver 1", "clock", p.time_driver_1_name, p.time_driver_1_impact);
      pushDriver(time, "Time Driver 2", "clock", p.time_driver_2_name, p.time_driver_2_impact);

      return { cost, time, all: [...cost, ...time] };
    };

    function ProjectTableModal({ open, onClose, projects, title = "Filtered Project Data", filters }) {
      const { theme } = useAppSettings();
      const [viewMode, setViewMode] = useState("cards");
      const [sortKey, setSortKey] = useState("state");
      const [sortDir, setSortDir] = useState("asc");
      const [cardSearch, setCardSearch] = useState("");
      const [cardSort, setCardSort] = useState("risk_desc");
      const [cardPage, setCardPage] = useState(1);
      const cardsPerPage = 24;
      const [detailProject, setDetailProject] = useState(null);

      useEffect(() => {
        if (open) {
          setViewMode("cards");
          setCardPage(1);
        }
      }, [open]);

      if (!open) return null;

      const rows = (projects || []).map((p, i) => {
        let status = p.status || p.project_status || p.currentStatus;
        if (!status) {
          if (Number(p.physicalProgress) >= 100) {
            status = "Completed";
          } else if (Number(p.delayMonths) > 0 || Number(p.currentSlippageMonths) > 0) {
            status = "Delayed";
          } else {
            status = "Under Implementation";
          }
        }
        return {
          ...p,
          srNo: p.srNo ?? i + 1,
          status,
        };
      });

      // Sorting for table view
      const sorted = [...rows].sort((a, b) => {
        const va = a[sortKey], vb = b[sortKey];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        const na = Number(va), nb = Number(vb);
        const cmp = Number.isFinite(na) && Number.isFinite(nb)
          ? na - nb
          : String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: "base" });
        return sortDir === "asc" ? cmp : -cmp;
      });

      const toggleSort = (key) => {
        if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
        else { setSortKey(key); setSortDir("asc"); }
      };

      // Cards filtering and sorting
      const filteredCards = rows.filter((r) => {
        if (!cardSearch.trim()) return true;
        const q = cardSearch.toLowerCase();
        return (
          (r.projectName && r.projectName.toLowerCase().includes(q)) ||
          (r.projectCode && String(r.projectCode).toLowerCase().includes(q)) ||
          (r.state && r.state.toLowerCase().includes(q)) ||
          (r.sector && r.sector.toLowerCase().includes(q)) ||
          (r.agency && r.agency.toLowerCase().includes(q))
        );
      });

      const sortedCards = [...filteredCards].sort((a, b) => {
        if (cardSort === "risk_desc") return (b.combined_risk ?? 0) - (a.combined_risk ?? 0);
        if (cardSort === "risk_asc") return (a.combined_risk ?? 0) - (b.combined_risk ?? 0);
        if (cardSort === "cost_desc") return (b.revisedCost ?? 0) - (a.revisedCost ?? 0);
        if (cardSort === "progress_desc") return (b.physicalProgress ?? 0) - (a.physicalProgress ?? 0);
        if (cardSort === "delay_desc") return (b.delayMonths ?? 0) - (a.delayMonths ?? 0);
        if (cardSort === "name_asc") return String(a.projectName || "").localeCompare(String(b.projectName || ""));
        return 0;
      });

      const totalCardPages = Math.max(1, Math.ceil(sortedCards.length / cardsPerPage));
      const currentCardPage = Math.min(cardPage, totalCardPages);
      const pagedCards = sortedCards.slice((currentCardPage - 1) * cardsPerPage, currentCardPage * cardsPerPage);

      const filterParts = [
        filters?.sector && filters.sector !== "All" ? `Sector: ${filters.sector}` : null,
        filters?.ministry && filters.ministry !== "All" ? `Ministry: ${filters.ministry}` : null,
        filters?.state && filters.state !== "All" ? `State/UT: ${filters.state}` : null,
        filters?.costBand && filters.costBand !== "All" ? `Cost: ${filters.costBand}` : null,
        filters?.month ? `Report month: ${filters.month}` : "Report month: Latest available",
      ].filter(Boolean);

      const formatCell = (r, c) => {
        const v = r[c.key];
        if (v == null || v === "") return "—";
        if (["originalCost", "revisedCost", "expenditure"].includes(c.key) && Number.isFinite(Number(v))) return fmtIndianNumber(v, 2);
        if (["physicalProgress", "costOverrunPct"].includes(c.key) && Number.isFinite(Number(v))) return fmtIndianNumber(v, 2) + "%";
        if (["delayMonths", "currentSlippageMonths"].includes(c.key) && Number.isFinite(Number(v))) return fmtIndianNumber(v, 2);
        if (["cost_risk", "time_risk", "combined_risk"].includes(c.key) && Number.isFinite(Number(v))) return Number(v).toFixed(4);
        if (c.key === "noScoreReason") {

        if (c.key === "status") {
          const st = getStatusStyle(v);
          return (
            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10.5px] font-semibold border"
              style={{ color: st.color, background: st.bg, borderColor: st.border }}>
              {v}
            </span>
          );
        }
        if (c.key === "risk_band") {
          const isHigh = v === "High";
          const isMed = v === "Medium";
          const color = isHigh ? "var(--red)" : isMed ? "var(--amber-deep)" : "var(--green)";
          const bg = isHigh ? "var(--red-bg)" : isMed ? "rgba(226,163,59,0.14)" : "var(--green-bg)";
          return (
            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold"
              style={{ color, background: bg, border: `1px solid ${color}30` }}>
              {v}
            </span>
          );
        }
        return String(v);
      };

      return (
        <div className="fixed inset-0 z-[80] flex items-center justify-center p-3 sm:p-4" role="dialog" aria-modal="true">

          <div className="relative w-full max-w-[96vw] max-h-[92vh] card-surface flex flex-col overflow-hidden rounded-2xl shadow-2xl border"
            style={{ borderColor: "var(--line)", animation: "modalIn .28s cubic-bezier(.16,.84,.44,1)" }}>
            <style>{`@keyframes modalIn { from { opacity:0; transform: scale(.96) translateY(8px);} to {opacity:1; transform: scale(1) translateY(0);} }`}</style>

            {/* Modal Header */}
            <div className="px-6 py-4 border-b shrink-0" style={{ borderColor: "var(--line)" }}>
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">

                  <div className="flex items-center gap-3">
                    <h3 className="font-display text-[19px] font-semibold">{title}</h3>
                    <span className="chip text-[11px] font-mono px-2 py-0.5" style={{ background: "var(--paper-2)", color: "var(--ink-soft)" }}>
                      {sorted.length.toLocaleString("en-IN")} records

                  </div>
                  <p className="text-[12px] mt-1" style={{ color: "var(--ink-soft)" }}>
                    Displaying Central Sector infrastructure projects with comprehensive scheduling, financial, and AI risk assessment metrics.

                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {filterParts.map((f) => <span key={f} className="chip text-[11.5px]" style={{ background: "var(--paper-2)", color: "var(--ink-soft)" }}>{f}</span>)}

                {/* View Switcher and Action Buttons */}

    // Live global SHAP aggregation from the current portfolio.
    // Uses the driver names and SHAP impacts supplied by /api/projects.
    const DRIVER_IMPACT_MAX_ABS = 2.4181;

    function buildGlobalShapDrivers(projects, type) {
      const totals = new Map();

      const addDriver = (name, impact) => {
        if (
          name === undefined ||
          name === null ||
          String(name).trim() === "" ||
          impact === undefined ||
          impact === null
        ) {
          return;
        }

        const value = Number(impact);
        if (!Number.isFinite(value)) return;

        const feature = String(name).trim();

        if (!totals.has(feature)) {
          totals.set(feature, {
            feature,
            sumAbsShap: 0,
            count: 0
          });
        }

        const item = totals.get(feature);
        item.sumAbsShap += Math.abs(value);
        item.count += 1;
      };

      for (const p of projects || []) {
        if (type === "time") {
          addDriver(p.time_driver_1_name, p.time_driver_1_impact);
          addDriver(p.time_driver_2_name, p.time_driver_2_impact);
        } else {
          addDriver(p.cost_driver_1_name, p.cost_driver_1_impact);
          addDriver(p.cost_driver_2_name, p.cost_driver_2_impact);
        }
      }

      return Array.from(totals.values())
        .map(item => ({
          feature: item.feature,
          mean_abs_shap: item.sumAbsShap / item.count
        }))
        .sort((a, b) => b.mean_abs_shap - a.mean_abs_shap)
        .slice(0, 7);
    }

    // Portfolio Risk Band Donut Chart
    function AIRiskDonutChart({ data }) {
      const total = data.reduce((acc, d) => acc + d.count, 0) || 1;
      const size = 170;
      const thickness = 22;
      const r = (size - thickness) / 2;
      const cx = size / 2, cy = size / 2;
      const circumference = 2 * Math.PI * r;

      let cumulative = 0;
      const slices = data.map((d) => {
        const frac = d.count / total;
        const len = frac * circumference;
        const offset = cumulative;
        cumulative += len;
        return { ...d, frac, len, offset };
      });

      return (
        <div className="flex flex-col sm:flex-row items-center gap-6 justify-center py-2">
          <div className="relative shrink-0" style={{ width: size, height: size }}>
            <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
              <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--line)" strokeWidth={thickness} />

    // Trend Line Chart showing combined_risk across score_as_of months
    function RiskTrendLineChart({ monthlyRecords }) {
      // Sort chronologically by score_as_of, filtering to valid scored records
      const records = (monthlyRecords || [])
        .filter(r => r.combined_risk !== null && r.combined_risk !== undefined && Number.isFinite(Number(r.combined_risk)))
        .sort((a, b) => a.score_as_of.localeCompare(b.score_as_of));
      if (records.length === 0) return null;

      const width = 500;
      const height = 150;
      const padLeft = 45;
      const padRight = 30;
      const padTop = 20;
      const padBottom = 30;

      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const points = records.map((r, i) => {
        const x = padLeft + (i / Math.max(1, records.length - 1)) * plotW;
        // combined_risk is 0-1
        const y = padTop + (1 - r.combined_risk) * plotH;
        return { x, y, record: r };
      });

      const pathD = points.reduce((acc, pt, i) => (
        i === 0 ? `M ${pt.x} ${pt.y}` : `${acc} L ${pt.x} ${pt.y}`
      ), "");

      const areaD = points.length > 0
        ? `${pathD} L ${points[points.length - 1].x} ${height - padBottom} L ${points[0].x} ${height - padBottom} Z`
        : "";

      return (
        <div className="w-full">
          <div className="flex items-center justify-between mb-2">
            <span className="text-[12px] font-semibold text-[var(--ink)]">
              Combined Escalation Risk Trajectory (Score As Of Monthly Cadence)
            </span>
            <span className="text-[11px] text-[var(--ink-soft)] font-mono">
              {records.length} Scored Cycles ({records[0]?.score_as_of} – {records[records.length - 1]?.score_as_of})
            </span>
          </div>
          <div className="w-full overflow-x-auto">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-full overflow-visible" style={{ maxHeight: "170px" }}>
              <defs>
                <linearGradient id="riskTrendGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="var(--red)" stopOpacity="0.25" />
                  <stop offset="100%" stopColor="var(--red)" stopOpacity="0.0" />
                </linearGradient>
              </defs>

              {/* Grid lines for 0%, 50%, 100% */}
              {[0, 0.5, 1.0].map((val) => {
                const y = padTop + (1 - val) * plotH;
                return (
                  <g key={val}>
                    <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke="var(--line)" strokeDasharray="3 3" />
                    <text x={padLeft - 6} y={y + 3} textAnchor="end" fontSize="9.5" fill="var(--ink-soft)" fontFamily="JetBrains Mono">
                      {Math.round(val * 100)}%
                    </text>
                  </g>
                );
              })}

              {/* Risk Band Reference Zones */}
              <line x1={padLeft} y1={padTop + (1 - 0.7) * plotH} x2={width - padRight} y2={padTop + (1 - 0.7) * plotH} stroke="rgba(210,75,75,0.3)" strokeWidth="1" />
              <line x1={padLeft} y1={padTop + (1 - 0.4) * plotH} x2={width - padRight} y2={padTop + (1 - 0.4) * plotH} stroke="rgba(226,163,59,0.3)" strokeWidth="1" />

              {/* Area fill and stroke */}
              <path d={areaD} fill="url(#riskTrendGrad)" />
              <path d={pathD} fill="none" stroke="var(--red)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

              {/* Data Points */}
              {points.map((pt, i) => (
                <g key={i} className="cursor-pointer group">
                  <circle cx={pt.x} cy={pt.y} r="4.5" fill="var(--card)" stroke="var(--red)" strokeWidth="2.5" />
                  {/* Value label */}
                  <text x={pt.x} y={pt.y - 8} textAnchor="middle" fontSize="10" fontWeight="bold" fill="var(--ink)" fontFamily="JetBrains Mono">
                    {(pt.record.combined_risk * 100).toFixed(0)}%
                  </text>
                  {/* X-axis Month Label */}
                  <text x={pt.x} y={height - padBottom + 16} textAnchor="middle" fontSize="9.5" fill="var(--ink-soft)" fontFamily="JetBrains Mono">
                    {pt.record.score_as_of}
                  </text>
                </g>
              ))}
            </svg>
          </div>
          <div className="flex items-center justify-between text-[11px] text-[var(--ink-soft)] mt-1 border-t border-[var(--line)] pt-1.5">
            <span className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full" style={{ background: "var(--red)" }} />
              Combined Risk Formula: 0.3 × Cost Rank + 0.7 × Timeline Rank
            </span>
            <span>Dynamic 3-Month Forward Risk Velocity</span>
          </div>
        </div>
      );
    }

      // Filter latest month records

      const latestRecords = useMemo(() => {

          const existing = latest.get(r.Project_UID);

            !existing ||
            r.score_as_of > existing.score_as_of

            latest.set(r.Project_UID, r);

                  {availableStates.map(s => (
                    <option key={s} value={s}>{s}</option>
                  ))}
                </select>

                <select
                  value={selectedBand}
                  onChange={(e) => setSelectedBand(e.target.value)}
                  className="text-[12px] px-2.5 py-1.5 rounded-lg border border-[var(--line)] bg-[var(--paper)] text-[var(--ink)] focus:outline-none"
                >
                  <option value="All">All Risk Tiers</option>
                  <option value="High">High Risk Only</option>
                  <option value="Medium">Medium Risk Only</option>
                  <option value="Low">Low Risk Only</option>
                </select>

                <input
                  type="text"
                  placeholder="Search UID or Name..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="text-[12px] px-3 py-1.5 rounded-lg border border-[var(--line)] bg-[var(--paper)] text-[var(--ink)] focus:outline-none w-36 sm:w-44"
                />
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-[12.5px] text-left">
                <thead>
                  <tr className="border-b border-[var(--line)] text-[11px] font-semibold uppercase tracking-wider text-[var(--ink-soft)] bg-[var(--paper)]">
                    <th className="py-2.5 px-3">#</th>
                    <th className="py-2.5 px-3">Project UID & Title</th>
                    <th className="py-2.5 px-3">State</th>
                    <th className="py-2.5 px-3">Risk Band</th>
                    <th className="py-2.5 px-3">Combined Risk</th>
                    <th className="py-2.5 px-3">Primary Risk Driver (Time Flag)</th>
                    <th className="py-2.5 px-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[var(--line)]">
                  {sortedWatchlist.map((row, idx) => {
                    const badge = getRiskBadgeStyle(row.risk_band);
                    const isSelected = row.Project_UID === selectedUid;
                    return (
                      <tr
                        key={row.Project_UID}
                        onClick={() => setSelectedUid(row.Project_UID)}
                        className={`cursor-pointer transition-all duration-200 ${isSelected
                          ? "bg-amber-500/10 font-medium"
                          : "hover:bg-black/[0.02]"
                          }`}
                      >
                        <td className="py-3 px-3 font-mono text-[11px] font-bold text-[var(--ink-soft)]">
                          {idx + 1}
                        </td>
                        <td className="py-3 px-3">
                          <div className="font-mono text-[11.5px] font-bold text-[var(--navy-900)] navy900-text">
                            {row.Project_UID}
                          </div>
                          <div className={`text-[12px] truncate max-w-[320px] ${/^\d+$/.test(String(row.Project_Group || "").trim()) ? "italic" : ""}`} style={{ color: /^\d+$/.test(String(row.Project_Group || "").trim()) ? "var(--ink-soft)" : "var(--ink)" }} title={/^\d+$/.test(String(row.Project_Group || "").trim()) ? "Project name not available in source data" : row.Project_Group}>
                            {/^\d+$/.test(String(row.Project_Group || "").trim()) ? "Project name not available" : row.Project_Group}
                          </div>
                        </td>
                        <td className="py-3 px-3 text-[var(--ink-soft)] font-medium">
                          {row.State}
                        </td>
                        <td className="py-3 px-3">
                          <span
                            className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11.5px] font-semibold border"
                            style={{ background: badge.bg, color: badge.text, borderColor: badge.border }}
                          >
                            <span className="w-2 h-2 rounded-full" style={{ background: badge.dot }} />
                            {row.risk_band}
                          </span>
                        </td>
                        <td className="py-3 px-3 font-mono font-bold text-[13px]" style={{ color: badge.text }}>
                          {(row.combined_risk * 100).toFixed(1)}%
                        </td>
                        <td className="py-3 px-3 text-[12px] text-[var(--ink)]">
                          <div className="flex items-center gap-1.5">
                            <span className="w-1.5 h-1.5 rounded-full bg-[var(--red)] shrink-0" />
                            <span className="truncate max-w-[260px]" title={row.time_driver_1_name}>
                              {row.time_driver_1_name}
                            </span>
                          </div>
                        </td>
                        <td className="py-3 px-3 text-right">
                          <button
                            onClick={(e) => { e.stopPropagation(); setSelectedUid(row.Project_UID); }}
                            className="px-2.5 py-1 rounded text-[11.5px] font-medium transition-colors border"
                            style={{
                              background: isSelected ? "var(--navy-900)" : "var(--paper)",
                              color: isSelected ? "#fff" : "var(--ink)",
                              borderColor: isSelected ? "var(--navy-900)" : "var(--line)"
                            }}
                          >
                            {isSelected ? "Active" : "Inspect"}
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* SECTION 5: PROJECT DRILL-DOWN (ON ROW CLICK) */}
          {activeRecord ? (
            <div className="glass-card p-5 sm:p-6 hover-lift rounded-[14px] space-y-6 border-2"
              style={{ borderColor: "var(--navy-700)" }}>
              {/* Header */}
              <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pb-4 border-b border-[var(--line)]">
                <div className="space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[11.5px] font-bold px-2 py-0.5 rounded bg-[var(--navy-900)] text-white">
                      Project UID: {activeRecord.Project_UID}
                    </span>
                    <span className="text-[12px] font-medium px-2 py-0.5 rounded bg-[var(--paper-2)] text-[var(--ink-soft)]">
                      State: {activeRecord.State}
                    </span>
                    <span className="text-[12px] font-medium px-2 py-0.5 rounded bg-[var(--paper-2)] text-[var(--ink-soft)]">
                      Snapshot Month: {activeRecord.snapshot_month}
                    </span>
                  </div>
                  <h2 className="font-display text-[18px] sm:text-[20px] font-bold navy950-text" style={{ color: "var(--navy-950)" }}>
                    {activeRecord.Project_Group}
                  </h2>
                </div>

                <div className="flex items-center gap-2">
                  <span className="text-[12px] font-semibold text-[var(--ink-soft)]">Scored As Of:</span>
                  <span className="font-mono font-bold text-[13px] px-3 py-1 rounded bg-[var(--paper-2)] text-[var(--navy-900)] navy900-text border border-[var(--line)]">
                    {activeRecord.score_as_of}
                  </span>
                </div>
              </div>

              {/* Three KPI Cards at Top */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {/* Card 1: Cost Escalation Risk */}
                <div className="p-4 rounded-xl border border-[var(--line)] bg-[var(--paper)] space-y-2">
                  <div className="flex items-center justify-between text-[12px]">
                    <span className="font-semibold uppercase tracking-wide text-[var(--ink-soft)]">Cost Escalation Risk</span>
                    <span className="font-mono text-[11px] font-semibold text-[var(--amber-deep)]">
                      {(activeRecord.cost_risk_pct * 100).toFixed(0)}th Percentile
                    </span>
                  </div>
                  <div className="flex items-baseline gap-2">
                    {activeRecord.cost_risk === null || activeRecord.cost_risk === undefined || !Number.isFinite(Number(activeRecord.cost_risk)) ? (
                      <span className="text-[12.5px] font-medium" style={{ color: "var(--ink-soft)" }}>
                        Not enough project history available to generate a risk score
                      </span>
                    ) : (
                      <>
                        <span className="font-display text-[28px] font-bold navy950-text" style={{ color: "var(--navy-950)" }}>
                          {(activeRecord.cost_risk * 100).toFixed(0)}%
                        </span>
                        <span className="text-[12px] font-medium text-[var(--ink-soft)]">likelihood</span>
                      </>
                    )}
                  </div>
                  <div className="w-full bg-[var(--line)] rounded-full h-2 overflow-hidden">
                    <div
                      className="h-full rounded-full transition-all duration-500 ease-out"
                      style={{
                        width: `${Math.round(activeRecord.cost_risk * 100)}%`,
                        background: "var(--amber-deep)"
                      }}
                    />
                  </div>
                  <p className="text-[11px] text-[var(--ink-soft)]">
                    Probability of cost divergence within 3-month horizon
                  </p>
                </div>

                {/* Card 2: Deadline Slip Risk */}
                <div className="p-4 rounded-xl border border-[var(--line)] bg-[var(--paper)] space-y-2">
                  <div className="flex items-center justify-between text-[12px]">
                    <span className="font-semibold uppercase tracking-wide text-[var(--ink-soft)]">Deadline Slip Risk</span>
                    <span className="font-mono text-[11px] font-semibold text-[var(--red)]">
                      {(activeRecord.time_risk_pct * 100).toFixed(0)}th Percentile
                    </span>
                  </div>
                  <div className="flex items-baseline gap-2">
                    {activeRecord.time_risk === null || activeRecord.time_risk === undefined || !Number.isFinite(Number(activeRecord.time_risk)) ? (
                      <span className="text-[12.5px] font-medium" style={{ color: "var(--ink-soft)" }}>
                        Not enough project history available to generate a risk score
                      </span>
                    ) : (
                      <>
                        <span className="font-display text-[28px] font-bold navy950-text" style={{ color: "var(--navy-950)" }}>
                          {(activeRecord.time_risk * 100).toFixed(0)}%
                        </span>
                        <span className="text-[12px] font-medium text-[var(--ink-soft)]">likelihood</span>
                      </>
                    )}
                  </div>
                  <div className="w-full bg-[var(--line)] rounded-full h-2 overflow-hidden">
                    <div
                      className="h-full rounded-full transition-all duration-500 ease-out"
                      style={{
                        width: `${Math.round(activeRecord.time_risk * 100)}%`,
                        background: "var(--red)"
                      }}
                    />
                  </div>
                  <p className="text-[11px] text-[var(--ink-soft)]">
                    Probability of schedule milestone slippage within 3 months
                  </p>
                </div>

                {/* Card 3: Overall Risk Band */}
                {(() => {
                  const badge = getRiskBadgeStyle(activeRecord.risk_band);
                  return (
                    <div className="p-4 rounded-xl border space-y-2"
                      style={{ background: badge.bg, borderColor: badge.border }}>
                      <div className="flex items-center justify-between text-[12px]">
                        <span className="font-semibold uppercase tracking-wide" style={{ color: badge.text }}>
                          Overall Risk Band
                        </span>
                        <span className="font-mono text-[11px] font-bold" style={{ color: badge.text }}>
                          Tier: {activeRecord.risk_band}
                        </span>
                      </div>
                      <div className="flex items-baseline gap-2">
                        {activeRecord.combined_risk === null || activeRecord.combined_risk === undefined || !Number.isFinite(Number(activeRecord.combined_risk)) ? (
                          <span className="text-[12.5px] font-medium" style={{ color: "var(--ink-soft)" }}>
                            Not enough project history available to generate a risk score
                          </span>
                        ) : (
                          <>
                            <span className="font-display text-[28px] font-bold" style={{ color: badge.text }}>
                              {(activeRecord.combined_risk * 100).toFixed(1)}%
                            </span>
                            <span className="text-[12px] font-medium opacity-80" style={{ color: badge.text }}>combined</span>
                          </>
                        )}
                      </div>
                      <div className="w-full bg-black/10 rounded-full h-2 overflow-hidden">
                        <div
                          className="h-full rounded-full transition-all duration-500 ease-out"
                          style={{
                            width: `${Math.min(100, Math.round(activeRecord.combined_risk * 100))}%`,
                            background: badge.dot
                          }}
                        />
                      </div>
                      <p className="text-[11px] opacity-80" style={{ color: badge.text }}>
                        Weighted: 30% Cost Rank + 70% Timeline Rank
                      </p>
                    </div>
                  );
                })()}
              </div>

              {/* Multi-Month Trend Chart */}
              <div className="p-4 rounded-xl border border-[var(--line)] bg-[var(--paper)]">
                <RiskTrendLineChart monthlyRecords={projectHistory} />
              </div>

              {/* Model Evidence: Exactly Two Separate Panels (Never Merged) */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* Panel 1: Deadline-Slip Drivers */}
                <div className="p-4 rounded-xl border border-[var(--line)] bg-white space-y-3">
                  <div className="flex items-center justify-between pb-2 border-b border-[var(--line)]">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--red)" }} />
                      <h4 className="font-display text-[14px] font-bold text-[var(--navy-950)]">
                        Model Evidence: Deadline-Slip Drivers
                      </h4>
                    </div>
                    <span className="text-[11px] font-mono font-semibold text-[var(--red)]">
                      Top 2 Time SHAP
                    </span>
                  </div>
                  <div className="space-y-2">
                    <DriverImpactBar
                      label={activeRecord.time_driver_1_name}
                      impact={activeRecord.time_driver_1_impact}
                      isTime={true}
                      maxVal={DRIVER_IMPACT_MAX_ABS}
                      fixedOnWhite={true}
                    />
                    <DriverImpactBar
                      label={activeRecord.time_driver_2_name}
                      impact={activeRecord.time_driver_2_impact}
                      isTime={true}
                      maxVal={DRIVER_IMPACT_MAX_ABS}
                      fixedOnWhite={true}
                    />
                  </div>
                </div>

                {/* Panel 2: Cost-Jump Drivers */}
                <div className="p-4 rounded-xl border border-[var(--line)] bg-white space-y-3">
                  <div className="flex items-center justify-between pb-2 border-b border-[var(--line)]">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--amber-deep)" }} />
                      <h4 className="font-display text-[14px] font-bold text-[var(--navy-950)]">
                        Model Evidence: Cost-Jump Drivers
                      </h4>
                    </div>
                    <span className="text-[11px] font-mono font-semibold text-[var(--amber-deep)]">
                      Top 2 Cost SHAP
                    </span>
                  </div>
                  <div className="space-y-2">
                    <DriverImpactBar
                      label={activeRecord.cost_driver_1_name}
                      impact={activeRecord.cost_driver_1_impact}
                      isTime={false}
                      maxVal={DRIVER_IMPACT_MAX_ABS}
                      fixedOnWhite={true}
                    />
                    <DriverImpactBar
                      label={activeRecord.cost_driver_2_name}
                      impact={activeRecord.cost_driver_2_impact}
                      isTime={false}
                      maxVal={DRIVER_IMPACT_MAX_ABS}
                      fixedOnWhite={true}
                    />
                  </div>
                </div>
              </div>
            </div>
          ) : null}

          {/* SECTION 4: ESCALATION DRIVER ANALYSIS (GLOBAL DRIVERS) */}
          <div className="space-y-4">
            <div>
              <h2 className="font-display text-[18px] font-semibold flex items-center gap-2 navy950-text" style={{ color: "var(--navy-950)" }}>
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--blue-chip)" }} />
                Escalation Driver Analysis (Global Portfolio SHAP)
              </h2>
              <p className="text-[12px]" style={{ color: "var(--ink-soft)" }}>
                Top feature importance ranked by mean absolute SHAP value across the entire national pilot training portfolio.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <GlobalDriversChart
                title="Global Deadline-Slip Drivers (Timeline)"
                drivers={[
                  { feature: "months_to_commission", mean_abs_shap: 1.624 },
                  { feature: "Implementing Agency", mean_abs_shap: 0.763 },
                  { feature: "Sector Name", mean_abs_shap: 0.412 },
                  { feature: "State_Group", mean_abs_shap: 0.363 },
                  { feature: "required_velocity", mean_abs_shap: 0.352 },
                  { feature: "Current_Slippage_Months", mean_abs_shap: 0.198 },
                  { feature: "delay_change", mean_abs_shap: 0.141 }
                ]}
                isTime={true}
              />
              <GlobalDriversChart
                title="Global Cost-Escalation Drivers (Budget)"
                drivers={[
                  { feature: "Sector Name", mean_abs_shap: 1.132 },
                  { feature: "Implementing Agency", mean_abs_shap: 1.071 },
                  { feature: "State_Group", mean_abs_shap: 0.513 },
                  { feature: "expenditure_ratio", mean_abs_shap: 0.223 },
                  { feature: "Cost Overrun (%)", mean_abs_shap: 0.194 },
                  { feature: "Expenditure (in cr.)", mean_abs_shap: 0.187 },
                  { feature: "spend_progress_gap", mean_abs_shap: 0.178 }
                ]}
                isTime={false}
              />
            </div>
          </div>

          {/* SECTION 3: MODEL TRANSPARENCY & VALIDATION */}
          <div className="space-y-4">
            <div>
              <h2 className="font-display text-[18px] font-semibold flex items-center gap-2 navy950-text" style={{ color: "var(--navy-950)" }}>
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: "var(--green)" }} />
                Model Transparency & Rigor Validation
              </h2>
              <p className="text-[12px]" style={{ color: "var(--ink-soft)" }}>
                Out-of-sample backtested validation metrics confirming statistical lift against conventional monitoring heuristics.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <ModelAccuracyChart data={MODEL_ACCURACY_METRICS} />
              <PrecisionAtKTable data={PRECISION_AT_K_METRICS} />
            </div>
          </div>
        </div>
      );
    }


    function App() {
      const [route, navigate] = useHashRoute();

      let Page;
      if (route === "/" || route === "") Page = <HomePage navigate={navigate} />;
      else if (route === "/dashboard") Page = <DashboardPage />;
      else if (route === "/ai-risk-intelligence") Page = <AIRiskIntelligencePage navigate={navigate} />;
      else Page = <HomePage navigate={navigate} />;

      return (
        <AppSettingsProvider>
          <div className="min-h-screen flex flex-col">
            <SiteHeader route={route} navigate={navigate} />
            <main className="flex-1">{Page}</main>
            <SiteFooter navigate={navigate} />
          </div>
        </AppSettingsProvider>
      );
    }

    function startApp() {
      ReactDOM.createRoot(
        document.getElementById("root")
      ).render(<App />);
    }

    async function initializeApp() {

      try {

        // JSON → ALL_PROJECTS
        await loadProjects();

        buildCurrentProjects();
        buildRiskRecords();
        buildDatasetOptions();

        // ONLY NOW start the application
        startApp();

      } catch (error) {

        console.error(
          "Application initialization failed:",
          error
        );
      }
    }

    initializeApp();
  </script>
</body>

</html>
